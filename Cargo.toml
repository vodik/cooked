[package]
name = "cooked"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Terminal emulator core for Emacs, with termios and OSC 133 awareness"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"
memchr = "2.7"
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
nix = { version = "0.31", features = ["fs", "poll", "process", "pthread", "signal", "term"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"

# `unreachable_pub` is what makes `dead_code` mean anything here: an item that is `pub`
# in a crate whose modules are `pub` is reachable by definition, so the compiler cannot
# say it is unused. Narrowing the default keeps that gate shut. The vendored parser opts
# out at the module, where its own contract explains why.
[lints.rust]
unreachable_pub = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
