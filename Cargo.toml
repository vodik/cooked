[package]
name = "cooked"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Terminal emulator core for Emacs, with termios and OSC 133 awareness"

# The `cdylib` is what Emacs dlopens; the `rlib` is what the integration tests and the
# throughput benchmark link against.
#
# No `-Wl,--version-script` here, and that is a finding rather than an omission. A
# module dlopened into Emacs should export exactly `emacs_module_init` and
# `plugin_is_GPL_compatible` and nothing that could collide with another loaded module,
# and it already does: `nm -D --defined-only target/release/libcooked.so` lists those
# two and no more. rustc builds a cdylib's export list itself, from the
# `#[unsafe(no_mangle)]` items, and hands it to the linker as a version script of its
# own.
#
# Adding a second one cannot narrow that. Tried, on this platform, with a `symbols.map`
# naming the two symbols and `local: *;`: with a deliberately added `#[unsafe(no_mangle)]
# pub extern "C" fn cooked_probe_symbol` the probe was exported both with and without the
# script, because ld unions the version scripts it is given and an explicit `global` in
# rustc's wins over a wildcard `local` in ours. So the script would have been decoration
# that looked like a guarantee. What does hold is rustc's own list, narrowed further by
# the `unreachable_pub` lint below: a new export takes a new `no_mangle` to write, and
# writing one is a visible thing to do.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
memchr = "2.7"
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
# nix re-exports the `libc` it is built on as `nix::libc`, and that is the only way this
# crate reaches libc: one copy of the bindings, at the version nix was tested against.
# `event` is kqueue, for Darwin's exit watch; `ioctl` is the macros every tty ioctl here
# goes through; posix_spawn comes with `process`.
nix = { version = "0.31", features = [
  "event", "fs", "ioctl", "poll", "process", "pthread", "signal", "term",
] }
unicode-segmentation = "1.13"
unicode-width = "0.2"

# `unreachable_pub` is what makes `dead_code` mean anything here: an item that is `pub`
# in a crate whose modules are `pub` is reachable by definition, so the compiler cannot
# say it is unused. Narrowing the default keeps that gate shut.
[lints.rust]
unreachable_pub = "warn"

# proptest drives `tests/delta_replay.rs`, the self-oracle over the damage tracker, and the
# chunking property in `src/emu/stream.rs`'s tests. It is a test dependency and must stay
# one: the module Emacs loads has the dependency list it has on purpose, and nothing under
# `src/` outside a `#[cfg(test)]` may grow this.
[dev-dependencies]
proptest = "1.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
