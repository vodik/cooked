name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 29.1 is the floor Package-Requires declares -- `defvar-keymap' and
        # `with-memoization' are both 29.1, and the tree uses them. The module
        # ABI check in `Runtime::compatible' is a size comparison rather than a
        # version test, so it needs no floor of its own. `release-snapshot'
        # catches a break against what users on master will actually have.
        emacs: ['29.1', '29.4', 'release-snapshot']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The end-to-end suite drives real children: zsh for the OSC 133 path, fish
      # and tmux for their own integration, and `stty -echo' for secrets. A test
      # whose program is missing skips, and a skip reads as passing.
      - name: Install shells and tmux
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y zsh fish tmux
          else
            brew install fish tmux
            command -v zsh
          fi

      # The optional Lisp packages the suite tests against, cloned the way
      # ghostel's CI does and named through EVIL_LOAD_PATH, which every target
      # that loads the suite passes to Emacs. Without them the evil, evil-collection
      # and consult tests skip. goto-chg is evil's one hard dependency, annalist is
      # evil-collection's, and compat is consult's.
      #
      # Each is pinned to a commit, so that a push to one of their default branches
      # cannot turn this suite red on a change nobody made here. They are the
      # commits the suite last passed against locally, 2026-09-13; compat's is the
      # upstream commit whose Lisp matches the ELPA mirror's. To bump one, run the
      # suite with EVIL_LOAD_PATH pointing at the new checkout, then replace its
      # hash below with `git rev-parse HEAD' there. A tag works too, since the
      # fetch takes any ref the remote advertises.
      - name: Install evil, evil-collection and consult
        run: |
          deps="$RUNNER_TEMP/elisp"
          mkdir -p "$deps"
          while read -r repo ref; do
            dir="$deps/$(basename "$repo" .el)"
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 "https://github.com/$repo.git" "$ref"
            git -C "$dir" checkout -q FETCH_HEAD
          done <<'PINS'
          emacs-evil/evil 6a3e1ddd04ac504a016590940d0af2a3361b9efd
          emacs-evil/goto-chg 72f556524b88e9d30dc7fc5b0dc32078c166fda7
          emacs-evil/evil-collection 1513aae3652101caf3227bcf7349e2e6fded3210
          noctuid/annalist.el f83019d61b82a64e621d8dfd63a527a578ff0a11
          minad/consult f10cf28d3df1e43a8069f5a507c82654834c8b09
          emacs-compat/compat f0787bca0f7eae45e51fa752b46e38f49e09137e
          PINS
          load_path=""
          for dir in "$deps"/*; do load_path="$load_path -L $dir"; done
          echo "EVIL_LOAD_PATH=$load_path" >> "$GITHUB_ENV"

      - run: make rust-test
      - run: make lisp-test
      - run: make lint
