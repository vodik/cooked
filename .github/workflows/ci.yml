name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 29.1 is the floor Package-Requires declares -- `defvar-keymap' and
        # `with-memoization' are both 29.1, and the tree uses them. The module
        # ABI check in `Runtime::compatible' is a size comparison rather than a
        # version test, so it needs no floor of its own. `release-snapshot'
        # catches a break against what users on master will actually have.
        emacs: ['29.1', '29.4', 'release-snapshot']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The end-to-end suite drives real children: zsh for the OSC 133 path, and
      # `stty -echo' for secrets. Without zsh those tests skip, which reads as
      # passing.
      - name: Install zsh
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y zsh
          else
            command -v zsh
          fi

      - run: make rust-test
      - run: make lisp-test
      - run: make lint
